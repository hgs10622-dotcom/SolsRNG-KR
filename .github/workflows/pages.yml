name: Deploy AETHER RNG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          source = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', source, flags=re.S)
          if not scripts:
              raise SystemExit('No inline application script found')
          open('/tmp/aether-inline.js', 'w', encoding='utf-8').write(scripts[-1])
          PY
          node --check /tmp/aether-inline.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
