name: Build and publish AETHER aura models
on:
  push:
    branches: [main]
    paths:
      - "tools/generate_aura_models.py"
      - "index.html"
      - ".github/workflows/build-aura-models.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model generator
        run: python -m pip install --upgrade pip trimesh numpy
      - name: Generate local GLB models
        run: python tools/generate_aura_models.py
      - name: Commit generated GLB assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/aura/*.glb
          if ! git diff --cached --quiet; then
            git commit -m "Generate original local aura GLB models"
            git push
          fi
